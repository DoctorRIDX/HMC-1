name: hmc1
description: "HMC: 1 - Hoross Mission Completion: 1. Offline single-player 3D open-world city game."
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/models/
  fonts:
    - family: Chorus
      fonts:
        - asset: assets/fonts/TeXGyreChorus-MediumItalic.otf
