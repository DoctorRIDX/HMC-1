name: Android Build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project, app icon and name (first run only)
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.hmc1 --project-name hmc1 .; fi
          rm -f test/widget_test.dart
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r tool/android_icons/mipmap-* android/app/src/main/res/
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"HMC: 1\"/" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hmc1-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
